<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7F5EF;
    --ink:#1F1D1A;
    --ink-soft:#5B564E;
    --orange:#EA6A20;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:17px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 24px;
  }
  main{
    width:100%;
    max-width:32rem;
    text-align:center;
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  .wordmark{
    font-family:"Space Grotesk",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-weight:600;
    font-size:clamp(2.25rem,9vw,3rem);
    letter-spacing:-0.02em;
    color:var(--orange);
    line-height:1.1;
  }
  .message{
    color:var(--ink);
    text-wrap:balance;
  }
  .contact{
    color:var(--ink-soft);
    font-size:0.95rem;
  }
  .contact a{
    color:var(--ink-soft);
    text-decoration:underline;
    text-underline-offset:3px;
    text-decoration-thickness:1px;
  }
  .contact a:hover{color:var(--ink)}
  .contact a:focus-visible{
    outline:2px solid var(--orange);
    outline-offset:3px;
    border-radius:2px;
  }
</style>
</head>
<body>
<main>
  <h1 class="wordmark">Routzi</h1>
  <p class="message">We&rsquo;re making some updates. Back soon.</p>
  <p class="contact"><a href="mailto:support@routzi.com">support@routzi.com</a></p>
</main>
</body>
</html>
